<!DOCTYPE html>
<html lang="bg">

<head>

<link rel="manifest" href="manifest.json">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beachfront App</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">


<!-- Източник -->

<div class="source-buttons">

    <button class="source active">
        Booking.com
    </button>

    <button class="source">
        По телефон
    </button>

    <button class="source">
        На място
    </button>

</div>


<!-- Дати и каравана -->

<div class="top-row">

    <input
        id="checkin"
        type="date"
    >

    <input
        id="checkout"
        type="date"
    >

    <select id="caravan">

        <option value="">🏖️</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>

    </select>

</div>


<!-- Гост -->

<input
    type="text"
    placeholder="Две имена"
>


<!-- Гости Card -->

<div class="guest-card">

<div class="counter-area">


    <!-- Възрастни -->

    <div class="counter-row">

        <div class="counter-name">
            Възрастни
        </div>

        <div class="counter">

            <button>-</button>

            <div
                class="counter-value"
                id="adults"
            >
                2
            </div>

            <button>+</button>

        </div>

    </div>


    <!-- Деца -->

    <div class="counter-row">

        <div class="counter-name">
            Деца
        </div>

        <div class="counter">

            <button>-</button>

            <div
                class="counter-value"
                id="children"
            >
                0
            </div>

            <button>+</button>

        </div>

    </div>


    <!-- Домашни любимци -->

    <div class="counter-row">

        <div class="counter-name">
            Домашни любимци
        </div>

        <div class="counter">

            <button>-</button>

            <div
                class="counter-value"
                id="pets"
            >
                0
            </div>

            <button>+</button>

        </div>

    </div>


</div>

</div>


<!-- Настаняване -->

<div class="option-group">

    <div class="option-title">
        Настаняване
    </div>

    <div class="option-buttons">

        <button class="option active">
            €0
        </button>

        <button class="option">
            €5
        </button>

        <button class="option">
            €10
        </button>

        <button class="option">
            €15
        </button>

    </div>

</div>


<!-- Цена -->

<div class="price-area">

    <div class="price-grid">

        <span>
            Корекция
        </span>

        <input
            id="correction"
            type="text"
            inputmode="decimal"
            placeholder="€0"
        >

        <span>
            Цена
        </span>

        <strong id="price">
            €0.00
        </strong>

    </div>

</div>


<!-- Контакт -->

<input
    type="tel"
    placeholder="+359 888 888 888"
    autocomplete="tel"
>


<textarea
    placeholder="Бележки"
></textarea>


<button class="save-button">

    Запази

</button>


</div>


<script src="script.js"></script>

</body>

</html>
